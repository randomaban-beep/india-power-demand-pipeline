name: Tests and quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check src server tests scripts
      - run: python -m ruff format --check src server tests scripts
      - run: python -m pytest --cov --cov-report=term-missing
      - run: python -m scripts.load_sample
      - run: python -m src.pipeline --db data/sample.db --output data/run-ci
